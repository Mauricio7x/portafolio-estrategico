  <!-- Monograma "d." de Detecta -->
  <text x="232" y="352" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif"
        font-size="320" font-weight="700" letter-spacing="-18" fill="#ffffff"
        text-anchor="middle">d<tspan fill="#cfe6ff">.</tspan></text>
