<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Detecta">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a84ff"/>
      <stop offset="1" stop-color="#0066cc"/>
    </linearGradient>
  </defs>
  <!-- Fondo a sangre completa para íconos maskable (zona segura central) -->
  <rect width="512" height="512" fill="#0d0d0f"/>
