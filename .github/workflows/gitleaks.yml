# Detekta · busca claves subidas por error al repositorio (decisión del dueño, 17-oct-2026).
#
# Qué hace: en cada push a main y en cada pull request revisa TODA la historia con gitleaks
# (programa MIT, versión fijada y su huella SHA-256 comprobada antes de correrlo). El repositorio
# es público: una clave de Upstash, de Vercel o de SECOP que llegue aquí la puede leer cualquiera.
#
# Qué NO hace: no bloquea nada. Es MODO AVISO: si encuentra algo, deja un aviso amarillo en la
# corrida y el resumen, y el flujo termina en verde. Volverlo bloqueante es decisión del dueño.
# Las excepciones viven en .gitleaksignore, cada una con su motivo. La salida va con --redact:
# los registros de un repositorio público son públicos, y un aviso que imprime la clave la filtra
# por segunda vez.
#
# Por qué el programa y no gitleaks/gitleaks-action: desde su v2.0.0 la acción dejó la licencia MIT
# por una propia (lo dice su README). El programa sigue siendo MIT.
name: Claves expuestas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Claves expuestas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Código (historia completa)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Descargar gitleaks y comprobar su huella
        run: |
          archivo="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archivo" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archivo}"
          echo "${GITLEAKS_SHA256}  ${archivo}" | sha256sum -c -
          tar -xzf "$archivo" gitleaks
          ./gitleaks version
      - name: Revisar la historia (modo aviso)
        run: |
          set +e
          ./gitleaks git . --redact --no-banner --report-format json --report-path informe.json
          codigo=$?
          set -e
          if [ "$codigo" -eq 0 ]; then
            echo "Sin claves expuestas en la historia." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$codigo" -ne 1 ]; then
            echo "::warning title=gitleaks no terminó::código de salida ${codigo}; revise la corrida"
            echo "gitleaks no terminó (código ${codigo}): la revisión no es válida." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          n=$(python3 -c "import json;print(len(json.load(open('informe.json'))))")
          echo "::warning title=Posibles claves expuestas::gitleaks encontró ${n}; los valores van tapados"
          {
            echo "## Posibles claves expuestas: ${n}"
            echo "Archivo, línea, regla y commit (el valor va tapado):"
            python3 -c "import json
          for x in json.load(open('informe.json')):
              print('- %s:%s · %s · commit %s' % (x['File'], x['StartLine'], x['RuleID'], x['Commit'][:10]))"
          } >> "$GITHUB_STEP_SUMMARY"
