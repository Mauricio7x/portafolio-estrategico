# Detekta · respaldo de las dos actualizaciones diarias (M-INF-16, 6-sep-2026; horario del
# dueño, 30-sep-2026).
#
# El horario lo fijó el dueño el 30-sep-2026: los datos se actualizan solos a las 7:50 a. m.
# y a las 8:00 p. m. de Colombia (UTC-5 todo el año, sin horario de verano). Quien los
# dispara es Vercel, con dos crons de vercel.json (12:50 y 01:00 UTC) seguidos cada uno
# de un latido (13:30 y 02:30 UTC) que retoma la actualización si quedó cortada.
# Verificado en vercel.com/docs/cron-jobs/usage-and-pricing el 30-sep-2026: todos los
# planes admiten 100 crons por proyecto; en el gratuito cada uno corre una vez al día y
# su hora no es puntual (la documentación: «0 1 * * *» cae entre la 1:00 y la 1:59; por
# ese ejemplo, el de las 12:50 UTC cae dentro de la hora de las 7 de Colombia); en Pro,
# al minuto. El plan del proyecto no consta medido.
#
# Este flujo es el RESPALDO de esos dos disparos, por si el de Vercel no llega: pide la
# actualización en modo `auto` (idempotente: si el dato está fresco cuesta unos pocos
# comandos y no hace trabajo). GitHub dispara con retraso cuando hay cola (medido: 2 h 30
# a 2 h 53 tarde), así que casi siempre llega cuando Vercel ya actualizó y no cuesta nada.
#
# El secreto: desde M-SEG-08 la sincronización exige `Authorization: Bearer
# <CRON_SECRET>` cuando esa variable existe en Vercel. El mismo valor va en GitHub →
# «Settings» → «Secrets and variables» → «Actions» → «New repository secret» con el
# nombre CRON_SECRET. Sin él la llamada responde 401 y este flujo lo dice y falla:
# un disparo que no dispara nada no puede quedar en verde.
#
# OJO: GitHub solo ejecuta los `schedule` de la rama por defecto (main), así que
# esto no corre hasta que el cambio esté en main. Y GitHub deshabilita los flujos
# programados de un repositorio sin actividad durante 60 días: si deja de correr,
# se vuelve a habilitar en la pestaña «Actions».
name: Actualización de la mañana y de la noche (respaldo)

on:
  schedule:
    # 12:50 UTC = 7:50 a. m. en Colombia · 01:00 UTC = 8:00 p. m. en Colombia
    - cron: '50 12 * * *'
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  actualizar:
    name: Pedir la actualización
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Llamar a la aplicación
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          URL="https://portafolio-estrategico.vercel.app/api/sync?modo=auto"
          CODIGO=$(curl -sS --max-time 300 -o respuesta.json -w '%{http_code}' \
            -H "Authorization: Bearer ${CRON_SECRET}" "$URL")
          echo "HTTP $CODIGO"
          cat respuesta.json || true
          echo
          if [ "$CODIGO" = "401" ]; then
            echo "La aplicación no reconoció la credencial. Cree el secreto CRON_SECRET en GitHub (Settings → Secrets and variables → Actions → New repository secret) con el MISMO valor que la variable CRON_SECRET de Vercel."
            exit 1
          fi
          if [ "$CODIGO" != "200" ]; then
            echo "La actualización no respondió 200. Mire https://portafolio-estrategico.vercel.app/api/procesos?op=salud"
            exit 1
          fi
