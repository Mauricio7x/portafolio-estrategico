# Detekta · el latido: termina solas las cargas cortadas (27-sep-2026, lib/latido).
#
# Por qué existe: la carga completa, la actualización y la extracción del histórico
# avanzan por tramos que se llaman a sí mismos, y esa llamada se pierde. Cada hora
# este flujo pregunta a la aplicación «¿quedó algo a medias?» y, si quedó, ella lanza
# UN tramo con el cursor que ya tenía guardado. Si no hay nada, cuesta un MGET.
#
# Cada hora y no cada 10 min (16-oct-2026): Vercel Hobby pausó el proyecto el
# 30-sep por CPU activa, y cada llamada despierta una función (144 al día eran 144
# arranques). Además vercel.json ya trae un latido una hora después de cada cron de
# actualización. Un latido en reposo gasta unos 66 ms de CPU en frío (medido en local);
# cada hora y no cada 3 para que el correo de la salud en rojo (dos latidos separados
# 20 min o más) no llegue horas tarde (revisión adversaria del 16-oct-2026).
#
# Por qué en GitHub y no en vercel.json: en el plan gratuito de Vercel un cron más
# frecuente que diario tumba el despliegue entero, y el plan no consta medido. Con
# Vercel Pro, esto se sustituye por una línea en vercel.json (reloj por minuto y
# puntual): { "path": "/api/latido", "schedule": "* * * * *" }.
#
# Limitación medida: GitHub retrasa los flujos programados cuando hay cola (el
# disparo de las 20:30 UTC llegó entre 2 h 30 y 2 h 53 tarde en 6 de 6 corridas),
# así que este reloj es irregular: retoma una carga cortada en horas, no en minutos.
#
# El secreto: el mismo CRON_SECRET de «Actualización de la tarde» (ya creado).
# El pase del muro (17-oct-2026): VERCEL_AUTOMATION_BYPASS_SECRET, el mismo de Vercel → «Settings» →
# «Deployment Protection» → «Protection Bypass for Automation». Con el muro de Vercel en todo el
# sitio, sin él la llamada recibe 302 (o 401 si pide JSON) con «Protected by Vercel Authentication» y el
# flujo lo dice; sin
# el secreto curl no manda la cabecera, así que sin muro todo sigue igual.
name: Latido (retoma lo que quedó a medias)

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  latido:
    name: Preguntar si quedó algo a medias
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Llamar a la aplicación
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          URL="https://detekta-app.vercel.app/api/latido"
          CODIGO=$(curl -sS --max-time 320 -o respuesta.json -w '%{http_code}' \
            -H "Authorization: Bearer ${CRON_SECRET}" -H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" "$URL" || echo "000")
          echo "HTTP $CODIGO"
          jq -c '{ok, accion, motivo, hecho}' respuesta.json 2>/dev/null || cat respuesta.json || true
          if [ "$CODIGO" = "302" ] || grep -qs "Protected by Vercel Authentication" respuesta.json; then
            echo "El muro de Vercel no dejó pasar la llamada (respondió $CODIGO, «Protected by Vercel Authentication»): falta el secreto VERCEL_AUTOMATION_BYPASS_SECRET en GitHub (Settings → Secrets and variables → Actions) o no es el mismo pase que el de Vercel (Settings → Deployment Protection → Protection Bypass for Automation)."
            exit 1
          fi
          if [ "$CODIGO" = "401" ]; then
            echo "La aplicación no reconoció la credencial. Cree el secreto CRON_SECRET en GitHub (Settings → Secrets and variables → Actions → New repository secret) con el MISMO valor que la variable CRON_SECRET de Vercel."
            exit 1
          fi
          if [ "$CODIGO" != "200" ]; then
            echo "El latido no respondió 200. Mire https://detekta-app.vercel.app/api/procesos?op=salud"
            exit 1
          fi

      # La sonda del muro (18-oct-2026): el 16-oct la cuenta nueva de Vercel trajo «Standard
      # Protection» y la producción quedó abierta un día sin que nadie lo viera. Este paso llama a
      # la portada SIN el pase, A PROPÓSITO: con el pase respondería 200 siempre y la alarma sonaría
      # en falso, así que no lleva ni el pase ni ningún secreto. El muro se reconoce EN POSITIVO
      # (medido el 18-oct): 302 hacia https://vercel.com/sso-api, o el texto «Protected by Vercel
      # Authentication». Un 200 sin ese texto es el muro apagado y la corrida falla en rojo. Todo lo
      # demás (un 403 del cortafuegos, un 429, un 5xx, otra redirección, sin respuesta) es «sin
      # dato»: se avisa y no falla. `-q` va primero para que curl no lea un .curlrc del corredor.
      # Corre aunque el paso anterior falle.
      - name: ¿El muro de Vercel sigue puesto?
        if: always()
        run: |
          RESPUESTA=$(curl -q -sS --max-time 20 -o portada.txt -w '%{http_code} %{redirect_url}' "https://detekta-app.vercel.app/" || true)  # SONDA DEL MURO: sin el pase, a propósito
          CODIGO=${RESPUESTA%% *}
          CODIGO=${CODIGO:-000}
          echo "Sin el pase, la portada respondió: ${RESPUESTA:-sin respuesta}"
          if grep -qs "Protected by Vercel Authentication" portada.txt || [[ "$RESPUESTA" == "302 https://vercel.com/sso-api"* ]]; then
            echo "El muro de Vercel está puesto."
          elif [ "$CODIGO" = "200" ]; then
            echo "::error title=Muro de Vercel apagado::EL MURO DE VERCEL ESTÁ APAGADO: cualquiera con la dirección puede entrar a Detekta y usar su llave. Vuelva a ponerlo: Vercel → el proyecto → «Settings» → «Deployment Protection» → «Vercel Authentication» → «All Deployments» → «Save»."
            exit 1
          else
            echo "::warning title=Muro de Vercel sin medir::No se pudo comprobar el muro (respondió $CODIGO): sin dato, no se da por apagado."
          fi
